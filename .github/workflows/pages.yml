# Publishes the static game to GitHub Pages.
# The site is a project site, so it is served at https://<owner>.github.io/Super-Mario/
# Asset URLs in index.html are relative and resolve under that path.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          # Root-absolute links would be fetched from the domain root and 404 on a project site.
          if grep -E '(href|src)="/' index.html; then
            echo "index.html uses root-absolute asset paths; use relative paths so /Super-Mario/ works."
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css js _site/
          cp .nojekyll _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
